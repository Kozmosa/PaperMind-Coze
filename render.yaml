# Render Blueprint —— PaperMind
# 单个 Web Service：Express 后端 + Expo Web 静态产物同进程托管，对外只有一个域名。
# 部署：https://dashboard.render.com/blueprint/new?repo=https://github.com/Kozmosa/PaperMind-Coze
services:
  - type: web
    name: papermind
    repo: https://github.com/Kozmosa/PaperMind-Coze
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # 免费实例：15 分钟无流量即休眠，冷启动要重新下载嵌入模型并重建向量索引，
    # 首次访问会明显变慢。建议配一个外部保活探针定时打 /api/v1/health（见 README）。
    # 需常驻时改为 0.5c-512mb（旧名 starter）。
    plan: free
    # 新加坡离国内最近
    region: singapore
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /api/v1/health
    # 免费实例不支持持久磁盘，上传资料与嵌入模型缓存都只存在于容器内，
    # 实例重启/重新部署后会丢失（数据库里的记录仍在，但文件预览会失效）。
    envVars:
      - key: NODE_ENV
        value: production
      # 该路由会把整个仓库目录（含密钥文件）暴露到公网，生产必须关闭
      - key: SERVE_PROJECT_FILES
        value: "false"

      # ---- 以下为密钥，在 Blueprint 创建向导里填写 ----
      - key: ANTHROPIC_BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COZE_SUPABASE_URL
        sync: false
      - key: COZE_SUPABASE_ANON_KEY
        sync: false
      - key: COZE_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # 后端通过 /api/v1/config 下发给浏览器（anon key 本就是要公开的值）
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
